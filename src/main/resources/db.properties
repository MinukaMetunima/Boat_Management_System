# Primary: Microsoft SQL Server (SQLEXPRESS / SSMS)
db.driver=net.sourceforge.jtds.jdbc.Driver
db.url=jdbc:jtds:sqlserver://localhost/boat_safari_db;instance=SQLEXPRESS;namedPipe=true
db.username=sa
db.password=0000

# Microsoft SQL Server Specific Connections (SSMS / SQLEXPRESS)
db.mssql.driver=net.sourceforge.jtds.jdbc.Driver
db.mssql.url=jdbc:jtds:sqlserver://localhost/boat_safari_db;instance=SQLEXPRESS;namedPipe=true
db.mssql.pipeUrl=jdbc:jtds:sqlserver://localhost/boat_safari_db;instance=SQLEXPRESS;namedPipe=true
db.mssql.namedUrl=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=boat_safari_db;encrypt=false;trustServerCertificate=true;
db.mssql.tcpUrl=jdbc:sqlserver://localhost:1433;databaseName=boat_safari_db;encrypt=false;trustServerCertificate=true;
db.mssql.username=sa
db.mssql.password=0000

# Secondary: MySQL 8.0 Server Configuration (Fallback)
db.mysql.driver=com.mysql.cj.jdbc.Driver
db.mysql.url=jdbc:mysql://localhost:3306/boat_safari_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.mysql.username=root
db.mysql.password=0000

db.pool.maxTotal=20
db.pool.maxIdle=5
db.pool.minIdle=2
